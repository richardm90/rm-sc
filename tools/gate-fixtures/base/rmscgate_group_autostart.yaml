# rmscgate_group_autostart - a built-in group name that is NOT excluded.
#
# EXERCISES  the scope of the default ignore list. Only 'system' is excluded by
#            default; 'autostart' is a built-in group name too (built-ins are
#            all, system, autogenerated, default, autostart) and must still show.
#            Without this fixture, an implementation excluding every built-in
#            group would pass rmscgate_group_system and look correct.
# UPSTREAM   PRESENT in a bare `check` and `list`, NOT RUNNING; 'autostart'
#            listed in `groups`.
# RMSC       identical.
# BASIS      chosen, from the plan (default --ignore-groups=system, and the
#            built-in group list).
# STAGING    none.
# ISOLATION  no.
# SAFETY     'autostart' means something on a real system: the *SC TCP server
#            starts that group at IPL. This pack is installed through
#            SC_SERVICES_DIR / -Dservices.dir for the duration of a gate run and
#            must NEVER be copied into /QOpenSys/etc/sc/services, where the *SC
#            server would find it. start_cmd is /QOpenSys/usr/bin/true, which
#            does nothing and exits 0, so an accidental start is harmless - but
#            do not rely on that instead of installing it correctly.
# FAILS IF   it is missing from a bare `check` - the ignore list has been widened
#            beyond 'system', and services would be disappearing from the
#            client's screen.
name: RMSC gate autostart group member
start_cmd: /QOpenSys/usr/bin/true
check_alive: rmscgatedeadas
groups:
- autostart
